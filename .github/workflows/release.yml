name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
      - run: npm ci --legacy-peer-deps --install-strategy=hoisted
      - run: npm run build --workspace web
      - name: Build installable APK (debug-signed)
        run: ./gradlew assembleDebug
        working-directory: apps/web/android
      - name: Publish APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp apps/web/android/app/build/outputs/apk/debug/app-debug.apk shishu-${GITHUB_REF_NAME##*v}.apk
          gh release create "$GITHUB_REF_NAME" "shishu-${GITHUB_REF_NAME##*v}.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Shishu $GITHUB_REF_NAME" \
            --notes "Installable Android APK (comes from the free PWA build via Capacitor — debug-signed for direct side-loading). Web app: https://mohaimin01.github.io/shishu/"
