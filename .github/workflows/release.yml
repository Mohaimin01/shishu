name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile || npm install --legacy-peer-deps --install-strategy=hoisted
      - run: pnpm build || npm run build --workspace web
        working-directory: apps/web
      - run: npx cap sync android
        working-directory: apps/web
      - name: Build APK
        run: ./gradlew assembleRelease
        working-directory: apps/web/android
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shishu-apk
          path: apps/web/android/app/build/outputs/apk/release/*.apk
